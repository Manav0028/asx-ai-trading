<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>realtime_chart_ai</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header>
    <h1 id="ticker-title">realtime_chart_ai</h1>
    <div id="status-bar">
      <span id="conn-status" class="badge disconnected">connecting…</span>
      <span id="source-badge" class="badge"></span>
    </div>
  </header>

  <main>
    <section id="chart-panel">
      <div id="chart-container"></div>
    </section>

    <aside id="side-panel">
      <div id="commentary-tab-bar">
        <button class="tab-btn active" data-tab="commentary">Claude Commentary</button>
        <button class="tab-btn" data-tab="journal">Journal History</button>
      </div>

      <div id="commentary-view" class="tab-view active">
        <div id="commentary-feed"></div>
      </div>

      <div id="journal-view" class="tab-view">
        <button id="refresh-journal">Refresh</button>
        <table id="journal-table">
          <thead>
            <tr><th>Time</th><th>Pattern</th><th>Dir</th><th>Score</th><th>Zone</th><th>Action</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
